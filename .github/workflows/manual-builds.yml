name: Manual platform builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in MAJOR.MINOR.PATCH form
        required: true
        default: "2.1.0"
        type: string
      release_date:
        description: UTC ISO 8601 release date
        required: true
        default: "2026-10-24T00:00:00Z"
        type: string
      commit_sha:
        description: Commit SHA recorded in the build manifest, blank uses the dispatched commit
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: manual-platform-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} smoke build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            architecture: x64
            executable: LeoMoon SubFix.exe
          - platform: windows-arm64
            runner: windows-11-vs2026-arm
            architecture: arm64
            executable: LeoMoon SubFix.exe
          - platform: linux-x86_64
            runner: ubuntu-24.04
            architecture: x64
            executable: LeoMoon SubFix
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            architecture: arm64
            executable: LeoMoon SubFix
          - platform: macos
            runner: macos-15
            architecture: arm64
            executable: LeoMoon SubFix

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            fontconfig libdbus-1-3 libegl1 libfontconfig1 libgl1 libopengl0 \
            libwayland-client0 libwayland-cursor0 libx11-6 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 xvfb

      - name: Install pinned AppImage tooling
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGE_RUNTIME_VERSION: "20251108"
        run: |
          tool_directory="$RUNNER_TEMP/leomoon-subfix-appimage-tools"
          mkdir -p "$tool_directory"
          if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
            appimage_arch=aarch64
            appimagetool_sha256=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
          else
            appimage_arch=x86_64
            appimagetool_sha256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          fi
          appimagetool="$tool_directory/appimagetool-$appimage_arch.AppImage"
          runtime="$tool_directory/runtime-$appimage_arch"
          curl --fail --location --retry 3 --output "$appimagetool" "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$appimage_arch.AppImage"
          curl --fail --location --retry 3 --output "$runtime" "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-$appimage_arch"
          printf '%s  %s\n' "$appimagetool_sha256" "$appimagetool" "$runtime_sha256" "$runtime" | sha256sum --check
          chmod +x "$appimagetool"
          echo "APPIMAGE_ARCH=$appimage_arch" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL_SHA256=$appimagetool_sha256" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME_SHA256=$runtime_sha256" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Create locked project environment
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin=.venv/Scripts/python.exe
            uv_bin=.venv/Scripts/uv.exe
          else
            python_bin=.venv/bin/python
            uv_bin=.venv/bin/uv
          fi
          "$python_bin" -m pip install "uv==0.13.5"
          "$uv_bin" sync --all-extras --locked
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"

      - name: Configure MSVC dependency tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $component = "${{ matrix.architecture == 'arm64' && 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' || 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }}"
          $installationPath = (& $vswhere -latest -products * -requires $component -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($installationPath)) { throw "Visual Studio C++ tools were not found" }
          $devCommand = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          & cmd.exe /s /c "`"$devCommand`" -no_logo -arch=${{ matrix.architecture }} -host_arch=${{ matrix.architecture }} && set" |
            ForEach-Object {
              $separator = $_.IndexOf("=")
              if ($separator -gt 0) {
                $name = $_.Substring(0, $separator)
                $value = $_.Substring($separator + 1)
                if ($name -notmatch '^(GITHUB_|RUNNER_|ACTIONS_)') {
                  "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                }
              }
            }

      - name: Regenerate Qt and test
        shell: bash
        run: |
          "$PYTHON_BIN" scripts/generate_qt.py
          git diff --exit-code -- src/leomoon_subfix/_generated/main_window.py
          "$PYTHON_BIN" -m ruff check src tests scripts
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME='' QT_STYLE_OVERRIDE=Fusion "$PYTHON_BIN" -m pytest -q -rs
          "$PYTHON_BIN" -m pip check

      - name: Build one-directory application
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_DATE: ${{ inputs.release_date }}
          BUILD_COMMIT: ${{ inputs.commit_sha || github.sha }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          "$PYTHON_BIN" scripts/build.py \
            --version "$BUILD_VERSION" \
            --release-date "$BUILD_DATE" \
            --commit "$BUILD_COMMIT" \
            --output-dir "build/manual-$BUILD_PLATFORM" \
            --clean

      - name: Verify Windows PE dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/verify-windows-build.ps1 -ApplicationPath "build\manual-${{ matrix.platform }}\leomoon-subfix\LeoMoon SubFix.exe" -Architecture "${{ matrix.architecture }}"

      - name: Package and verify Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_DATE: ${{ inputs.release_date }}
          BUILD_COMMIT: ${{ inputs.commit_sha || github.sha }}
        run: |
          scripts/package-linux.sh \
            --stage-dir "build/manual-${{ matrix.platform }}/leomoon-subfix" \
            --dist-dir "dist/manual-linux-$APPIMAGE_ARCH" \
            --version "$BUILD_VERSION" \
            --release-date "$BUILD_DATE" \
            --commit "$BUILD_COMMIT" \
            --architecture "$APPIMAGE_ARCH" \
            --appimagetool "$APPIMAGETOOL" \
            --appimagetool-sha256 "$APPIMAGETOOL_SHA256" \
            --runtime-file "$APPIMAGE_RUNTIME" \
            --runtime-sha256 "$APPIMAGE_RUNTIME_SHA256"

      - name: Launch Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/smoke-linux-appimage.sh "dist/manual-linux-$APPIMAGE_ARCH/leomoon-subfix-${{ inputs.version }}-linux-$APPIMAGE_ARCH.AppImage"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_DATE: ${{ inputs.release_date }}
          BUILD_COMMIT: ${{ inputs.commit_sha || github.sha }}
        run: '& scripts/package-windows.ps1 -StageDirectory "build\manual-${{ matrix.platform }}\leomoon-subfix" -DistDirectory "dist\manual-windows-${{ matrix.architecture }}" -Version "$env:BUILD_VERSION" -ReleaseDate "$env:BUILD_DATE" -Commit "$env:BUILD_COMMIT" -Architecture "${{ matrix.architecture }}"'

      - name: Launch packaged application
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
        run: '"$PYTHON_BIN" scripts/smoke_bundle.py "build/manual-$BUILD_PLATFORM/leomoon-subfix/$EXECUTABLE"'

      - name: Upload build diagnostics and artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-subfix-${{ matrix.platform }}-${{ github.sha }}
          path: |
            build/manual-${{ matrix.platform }}/leomoon-subfix/
            build/manual-${{ matrix.platform }}/release-manifest.json
            build/manual-${{ matrix.platform }}/.work/pyinstaller/subfix/warn-subfix.txt
            build/manual-${{ matrix.platform }}/.work/pyinstaller/subfix/xref-subfix.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-subfix-windows-installer-${{ matrix.architecture }}-${{ github.sha }}
          path: dist/manual-windows-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-subfix-linux-appimage-${{ matrix.architecture }}-${{ github.sha }}
          path: dist/manual-linux-${{ matrix.architecture == 'arm64' && 'aarch64' || 'x86_64' }}/
          if-no-files-found: error
          retention-days: 14

  windows-installer-smoke:
    name: Windows installer smoke test (${{ matrix.architecture }})
    needs: build
    runs-on: ${{ matrix.architecture == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2022' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download Windows installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: leomoon-subfix-windows-installer-${{ matrix.architecture }}-${{ github.sha }}
          path: dist

      - name: Install, upgrade, convert, and uninstall
        shell: pwsh
        run: '& scripts/smoke-windows-installer.ps1 -ArtifactDirectory "$env:GITHUB_WORKSPACE\dist" -Version "${{ inputs.version }}" -Architecture "${{ matrix.architecture }}"'
